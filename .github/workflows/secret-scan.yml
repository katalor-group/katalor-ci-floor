name: Secret Scan (org floor)

# Public, reusable secret-scanning check -- the org-wide CI floor. Every Katalor
# property or client repo calls this instead of vendoring a local copy, so there is
# exactly one copy to keep current, not N drifted copies (the problem this repo
# exists to remove -- see README.md).
#
# TruffleHog over a pattern-only scanner: it VERIFIES whether a match is a live,
# active credential, not just a regex hit against it -- materially fewer false
# positives than pattern-matching alone. Same "don't train an override reflex on
# noise" discipline this org already applies to container-scan Class A/B
# (katalor-internal-security's ci-security-scanning.md). No license key to hold or
# rotate: TruffleHog's OSS CLI/Action is AGPL-3.0; straightforward CI use here --
# no redistribution, no modified fork offered as a service -- does not trigger
# AGPL's network-copyleft clause.
#
# Only generic, non-property-specific checks belong in this repo (README.md).

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      # Diff scope, not full history -- the weekly-full-history-sweep.yml reusable
      # workflow in this same repo covers what a squash-merge or a PR predating
      # adoption could hide from a diff-only check.
      - name: TruffleHog -- verified secrets in this PR's diff
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown --fail
