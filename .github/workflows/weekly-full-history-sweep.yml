name: Secret Scan (weekly full-history sweep)

# Reusable workflow -- called by each property/client repo's OWN scheduled trigger
# (cron lives in the caller; a reusable workflow cannot schedule itself). Scans the
# full git history, not just a PR's diff -- catches a secret a squash-merge could
# hide from secret-scan.yml, or one committed before this floor repo was adopted.
#
# Caller shape:
#
#   on:
#     schedule:
#       - cron: '0 6 * * 1'   # weekly, property's own choice of day/time
#     workflow_dispatch: {}
#   jobs:
#     sweep:
#       uses: katalor-group/katalor-ci-floor/.github/workflows/weekly-full-history-sweep.yml@v1
#       permissions:
#         contents: read
#
# Optional, history-only: `with: exclude_paths_file: .github/secret-sweep-exclude.txt` names a file in the
# caller's checkout of anchored, literal path patterns TruffleHog skips. It exists for history that cannot be
# rewritten (a test fixture's fake credential, already fixed at HEAD). The file is validated before the scan
# and printed in full on every run; any violation fails the job. See README "Excluding history-only false positives".

on:
  workflow_call:
    inputs:
      exclude_paths_file:
        description: >-
          Optional path (relative to the caller's repo root) to a file of anchored literal path patterns,
          at most 20 lines, one file per line. Empty (default) = no exclusions and an unchanged scan.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sweep:
    name: Secret Scan (full history)
    runs-on: ubuntu-latest
    # A full-history scan of a small repo ran 13 to 16 seconds; a large history can take far longer, so this bound is wider than the diff
    # scan's. 30 minutes still bounds a hung container pull or scan for every adopter. Raise it by PR if a real sweep needs more.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs only when the caller passes the input. The value arrives through env, never interpolated into the script. Any failure
      # fails the job: there is no fallback to scanning without the exclusion, and none to skipping the check. The accepted
      # grammar is an ALLOWLIST (literal path characters and escaped dots between ^ and $), strictly narrower than "no wildcards":
      # it also rejects character classes, alternation, groups and unescaped dots, any of which could cover more than one file.
      - name: Validate exclude_paths_file
        id: validate_exclude
        if: inputs.exclude_paths_file != ''
        env:
          EXCLUDE_FILE: ${{ inputs.exclude_paths_file }}
          WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=exclude_paths_file rejected::$1"; exit 1; }
          f="$EXCLUDE_FILE"
          [[ "$f" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || fail "path must be relative and match [A-Za-z0-9._/-]+"
          [[ "$f" != *..* ]] || fail "path must not contain '..'"
          [ ! -L "$f" ] || fail "path is a symlink"
          [ -f "$f" ] || fail "not a regular file"
          real="$(realpath -- "$f")"
          case "$real" in "$WORKSPACE"/*) ;; *) fail "path resolves outside the checkout (symlinked directory?)";; esac
          lines="$(grep -c '' "$f" || true)"
          [ "$lines" -le 20 ] || fail "$lines lines; at most 20 allowed"
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            [ -z "$line" ] && continue
            [[ "$line" =~ ^\^([A-Za-z0-9_/-]|\\\.)+\$$ ]] \
              || fail "line $n is not an anchored literal path (^path\\.ext\$): $line"
          done < "$f"
          echo "::group::Exclusions applied to this sweep ($f)"
          cat -- "$f"
          echo "::endgroup::"
          echo "exclude_paths_file accepted: $lines line(s) from $f"

      - name: TruffleHog -- verified secrets across all reachable history
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          # NOT --fail here -- the action's own script (action.yml) unconditionally
          # appends --fail to the constructed CLI invocation already; adding it again
          # in extra_args produces a literal duplicate flag and trufflehog refuses to
          # run at all ("flag 'fail' cannot be repeated"), failing every caller
          # regardless of findings. Found live 2026-09-19 on the first real cross-org
          # adopter (aws-templates) the day this repo went public.
          # Only --exclude-paths=<validated file> may be appended, and only when exclude_paths_file is set; with it empty this
          # evaluates to exactly "--results=verified,unknown". There is deliberately no free-form extra-args input.
          extra_args: --results=verified,unknown${{ inputs.exclude_paths_file != '' && format(' --exclude-paths={0}', inputs.exclude_paths_file) || '' }}
          # Scanner version pinned to a release AND the digest of that release's image. The action's `version` input
          # defaults to "latest", so without this every adopter scanned with whatever ghcr.io/trufflesecurity/trufflehog:latest
          # was that day (an unreviewed binary in every repo's CI). The action runs "${image}:${version}", and
          # Docker resolves "tag@digest" by the digest, so this is the exact image read from the registry on 2026-10-19.
          # Bump it BY PR together with the action's commit pin above (Dependabot moves only the action pin, not this).
          version: "3.99.0@sha256:39ee0643ae620664287bcc95f133f3fc8484590d6ca4e7105d96b90dac4b9f6f"
