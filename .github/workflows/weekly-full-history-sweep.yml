name: Secret Scan (weekly full-history sweep)

# Reusable workflow -- called by each property/client repo's OWN scheduled trigger
# (cron lives in the caller; a reusable workflow cannot schedule itself). Scans the
# full git history, not just a PR's diff -- catches a secret a squash-merge could
# hide from secret-scan.yml, or one committed before this floor repo was adopted.
#
# Caller shape:
#
#   on:
#     schedule:
#       - cron: '0 6 * * 1'   # weekly, property's own choice of day/time
#     workflow_dispatch: {}
#   jobs:
#     sweep:
#       uses: katalor-group/katalor-ci-floor/.github/workflows/weekly-full-history-sweep.yml@v1
#       permissions:
#         contents: read

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  sweep:
    name: Secret Scan (full history)
    runs-on: ubuntu-latest
    # A full-history scan of a small repo ran 13 to 16 seconds; a large history can take far longer, so this bound is wider than the diff
    # scan's. 30 minutes still bounds a hung container pull or scan for every adopter. Raise it by PR if a real sweep needs more.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog -- verified secrets across all reachable history
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # NOT --fail here -- the action's own script (action.yml) unconditionally
          # appends --fail to the constructed CLI invocation already; adding it again
          # in extra_args produces a literal duplicate flag and trufflehog refuses to
          # run at all ("flag 'fail' cannot be repeated"), failing every caller
          # regardless of findings. Found live 2026-09-19 on the first real cross-org
          # adopter (aws-templates) the day this repo went public.
          extra_args: --results=verified,unknown
          # Scanner version pinned to a release AND the digest of that release's image. The action's `version` input
          # defaults to "latest", so without this every adopter scanned with whatever ghcr.io/trufflesecurity/trufflehog:latest
          # was that day (an unreviewed binary in every repo's CI). The action runs "${image}:${version}", and
          # Docker resolves "tag@digest" by the digest, so this is the exact image read from the registry on 2026-10-19.
          # Bump it BY PR together with the action's commit pin above (Dependabot moves only the action pin, not this).
          version: "3.99.0@sha256:39ee0643ae620664287bcc95f133f3fc8484590d6ca4e7105d96b90dac4b9f6f"
